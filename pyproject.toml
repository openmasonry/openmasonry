[project]
name = "openmasonry"
version = "0.1.0"
description = "Reference verifier for OpenMasonry, a verifiable, tokenless, self-governing fraternity of 33 degrees."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

# Install editable only (pip install -e .): the tools read canon/, network.toml and the manifest from
# the repository's own layout, and a built wheel does not carry them.
[project.scripts]
openmasonry = "openmasonry.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
