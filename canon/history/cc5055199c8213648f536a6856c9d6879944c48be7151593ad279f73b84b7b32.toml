# OpenMasonry: the canonical degree table.
#
# This file is the single source of truth for the 33 degrees. Every document,
# coat of arms and eligibility check is generated from it. Changing it is a
# constitutional amendment (see CONSTITUTION.md, Art. VII).
#
# Field reference
#   n           degree number (1..33)
#   house       the body that confers it (see [[house]] below)
#   title       the OpenMasonry title
#   historical  the name of the corresponding degree in the Ancient and
#               Accepted Scottish Rite, Southern Jurisdiction (public
#               historical record; used for reference only, no ritual is
#               reproduced)
#   virtue      the virtue the degree asks the member to practice
#   art         the field of knowledge studied in the degree
#   lesson      the one-sentence teaching of the degree (original text)
#   work        the "masterwork" required to apply for it
#   wait_days   minimum days a member must hold the PREVIOUS degree
#   examiners   number of examiners drawn by lot (degree >= n)
#   unlocks     the duty the degree makes the member eligible for
#   tincture, ordinary, charge
#               heraldic description used by src/openmasonry/heraldry.py

[[house]]
id = "craft"
name = "The Craft Lodge"
range = [1, 3]
purpose = "Self-knowledge and the tools of the work."

[[house]]
id = "perfection"
name = "The Lodge of Perfection"
range = [4, 14]
purpose = "Duty, stewardship and justice inside the community."

[[house]]
id = "rose"
name = "The Chapter of the Rose"
range = [15, 18]
purpose = "Rebuilding, liberty of conscience and active charity."

[[house]]
id = "kadosh"
name = "The Council of Kadosh"
range = [19, 30]
purpose = "Philosophy, law, and the defense of the commons against capture."

[[house]]
id = "consistory"
name = "The Consistory"
range = [31, 32]
purpose = "Audit, judgment and the balance of powers."

[[house]]
id = "council"
name = "The Supreme Council"
range = [33, 33]
purpose = "Guardianship of the Constitution. Serves; never commands."

