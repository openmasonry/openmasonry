title = "Apprentice of the Open Craft"
historical = "Entered Apprentice"
virtue = "Humility"
art = "Grammar and Rhetoric: learning to read the work and speak clearly about it"
lesson = "Before you shape the stone, learn to see the stone that you are."
work = "Signed declaration of the Landmarks (the petition); after admission, a first public reflection (500+ words) at a public URL the member controls, recorded as a work entry. No examination: the admission ballot confers the degree"
